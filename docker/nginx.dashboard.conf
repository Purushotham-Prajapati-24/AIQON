server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Same-origin API: /api/v1/... -> ${CASCADE_API_UPSTREAM}/v1/...
    location /api/ {
        proxy_pass ${CASCADE_API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change; everything else is revalidated. (add_header in a
    # location replaces the inherited ones, so each location repeats nosniff.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # The recorded run: a missing file is a 404, not the app shell.
    location /snapshot/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        try_files $uri $uri/ /index.html;
    }
}
