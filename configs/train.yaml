# Training configuration (see docs/Design.md §6). Small-data defaults.
target_mode: residual         # residual over the operator-rulebook projection | remaining
n_estimators: 300
learning_rate: 0.04
num_leaves: 15
max_depth: 5
min_data_in_leaf: 20
feature_fraction: 0.8
bagging_fraction: 0.8
lambda_l2: 1.0
monotone: true                # applied to the late classifier (LightGBM forbids it for quantile objectives)
stage_models: true
late_threshold_h: 24
alpha: 0.2                    # P10-P90 nominal coverage = 1 - alpha
seed: 0
